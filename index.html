<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nebula Heart 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030207;color:#fff;font-family:system-ui,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 0 14px #ff35b5}h1{font-size:clamp(20px,5vw,30px);letter-spacing:.12em;margin:8px;color:#ffd5f3}#status{font-size:13px;color:#e8b8df}
#camwrap{position:fixed;right:10px;top:70px;width:105px;height:140px;border:1px solid #ff73d2;border-radius:12px;overflow:hidden;background:#130816}#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#hint{position:fixed;bottom:78px;left:12px;right:12px;text-align:center;font-size:12px;color:#e0c0dc;line-height:1.5}#buttons{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px}
button{border:1px solid #ff8bd9;background:#350d32;color:white;border-radius:24px;padding:12px 16px;font-size:14px}
#start{position:fixed;inset:0;background:radial-gradient(ellipse,#260d30,#030207 72%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:5}#startbox{max-width:360px}#start p{color:#e8cde5;line-height:1.5}#start button{font-size:16px;padding:14px 22px;background:#b51783}.small{font-size:12px;color:#bca5bb}
</style></head><body>
<canvas id="scene"></canvas><div id="hud"><h1>NEBULA HEART 3D</h1><div id="status">Нажми «Включить камеру»</div></div>
<div id="camwrap"><video id="cam" autoplay playsinline muted></video></div>
<div id="hint">Покажи ладонь камере · двигай рукой влево/вправо для поворота · своди/разводи большой и указательный пальцы для размера</div>
<div id="buttons"><button id="reset">Сбросить сердце</button><button id="hidecam">Скрыть камеру</button></div>
<div id="start"><div id="startbox"><h1>💗 NEBULA HEART</h1><p>Светящееся сердце из частиц, которым можно управлять жестами руки.</p><button id="startbtn">Включить камеру</button><p class="small">Для работы нужен интернет и разрешение на камеру.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(()=>{const canvas=document.getElementById('scene'),status=document.getElementById('status'),video=document.getElementById('cam');let renderer,scene,camera,heart,mat,tracker,camRunner,rot=0,targetRot=0,size=1,targetSize=1,found=false;const N=5000,pos=new Float32Array(N*3),col=new Float32Array(N*3);
function point(){for(let j=0;j<300;j++){let x=Math.random()*2.5-1.25,y=Math.random()*2.5-1.25;if(Math.pow(x*x+y*y-1,3)-x*x*Math.pow(y,3)<=0)return[x*1.05,y*1.05,(Math.random()-.5)*.42]}return[0,0,0]}
function init(){renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030207);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.z=5.3;for(let i=0;i<N;i++){let p=point();pos.set(p,i*3);col[i*3]=1;col[i*3+1]=.08+Math.random()*.35;col[i*3+2]=.4+Math.random()*.6}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));mat=new THREE.PointsMaterial({size:.018,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false});heart=new THREE.Points(g,mat);scene.add(heart);let sg=new THREE.BufferGeometry(),sp=new Float32Array(1000*3);for(let i=0;i<1000;i++){sp[i*3]=(Math.random()-.5)*5;sp[i*3+1]=(Math.random()-.5)*4;sp[i*3+2]=(Math.random()-.5)*2}sg.setAttribute('position',new THREE.BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x9b267d,size:.012,transparent:true,opacity:.6})));animate()}
function animate(){requestAnimationFrame(animate);if(heart){rot+=(targetRot-rot)*.08;size+=(targetSize-size)*.08;heart.rotation.y=rot;heart.rotation.x=.15+Math.sin(Date.now()*.0007)*.05;heart.scale.setScalar(size*(1+Math.sin(Date.now()*.002)*.018));mat.size=.014+.008*(.5+.5*Math.sin(Date.now()*.003));renderer.render(scene,camera)}}
async function start(){let b=document.getElementById('startbtn');b.disabled=true;b.textContent='Подключаем камеру…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Камера доступна только на защищённой HTTPS-странице. Открой HTML через онлайн-редактор, например CodePen.');video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});await video.play();if(!window.Hands)throw Error('Не загрузилась библиотека распознавания. Проверь интернет.');tracker=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});tracker.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});tracker.onResults(r=>{if(r.multiHandLandmarks?.length){let l=r.multiHandLandmarks[0],x=(l[0].x+l[5].x+l[17].x)/3,d=Math.hypot(l[4].x-l[8].x,l[4].y-l[8].y);targetRot=(x-.5)*2.4;targetSize=Math.max(.58,Math.min(1.65,.55+d*2.7));if(!found)status.textContent='Рука найдена! Двигай рукой и меняй жест';found=true}else{found=false;status.textContent='Покажи ладонь камере'}});camRunner=new Camera(video,{onFrame:async()=>{if(tracker)await tracker.send({image:video})},width:640,height:480});await camRunner.start();document.getElementById('start').style.display='none'}catch(e){alert('Не удалось запустить: '+e.message);b.disabled=false;b.textContent='Попробовать снова';status.textContent='Не удалось запустить камеру'}}
document.getElementById('startbtn').onclick=start;document.getElementById('reset').onclick=()=>{targetRot=0;targetSize=1};document.getElementById('hidecam').onclick=()=>{let e=document.getElementById('camwrap');e.style.display=e.style.display==='none'?'block':'none'};addEventListener('resize',()=>{if(renderer){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}});init()})();
</script></body></html>
