<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nebula Heart 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070311;color:#ffe8fb;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px 12px 20px}
.top{display:flex;justify-content:space-between;gap:10px}.brand strong{display:block;font-size:clamp(18px,5vw,25px);letter-spacing:.12em;text-shadow:0 0 18px #ff45c8}.brand span{font-size:11px;color:#caa5e4}
.pill{background:#180d2ccc;border:1px solid #a95bc477;border-radius:99px;padding:8px;font-size:11px}
.bottom{display:flex;flex-direction:column;align-items:center;gap:9px}#status{max-width:96%;text-align:center;padding:9px 12px;border-radius:14px;background:#140923e8;border:1px solid #8b3eaa66;font-size:13px;line-height:1.35}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;pointer-events:auto}
button{border:1px solid #f18cde88;color:#fff3fd;background:linear-gradient(135deg,#b61d9a,#6823a8);border-radius:99px;padding:10px 13px;font-size:13px;font-weight:650}
button.secondary{background:#1b1030e8;border-color:#9560b777}#cam{display:none;position:fixed;right:10px;bottom:130px;width:100px;height:135px;object-fit:cover;transform:scaleX(-1);border-radius:12px;border:1px solid #f4a5e8aa;opacity:.75}
#hint{color:#b99acb;text-align:center;font-size:11px}
</style></head><body>
<div id="stage"></div><div id="ui">
<div class="top"><div class="brand"><strong>NEBULA HEART</strong><span>3D PARTICLE EXPERIENCE</span></div><div class="pill" id="mode">TOUCH / MOUSE</div></div>
<div class="bottom"><div id="status">Нажми «Включить камеру», чтобы управлять сердцем рукой.</div>
<div class="controls"><button id="cameraBtn">♡ Включить камеру</button><button id="resetBtn" class="secondary">Сбросить</button><button id="sizeDown" class="secondary">− Размер</button><button id="sizeUp" class="secondary">+ Размер</button></div>
<div id="hint">Для камеры нужен HTTPS. Сердце можно вращать пальцем, размер менять кнопками.</div></div></div>
<video id="cam" autoplay muted playsinline></video>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
(()=>{
const stage=document.getElementById('stage'),status=document.getElementById('status'),mode=document.getElementById('mode'),video=document.getElementById('cam'),cameraBtn=document.getElementById('cameraBtn');
let scene,camera,renderer,heart,cloud,outline,handCamera=null,hands=null,cameraOn=false;
let tx=-.12,ty=.18,ts=1,cs=1,lastPinch=null,lastSeen=0;
function hp(t,f=1){return{x:16*Math.pow(Math.sin(t),3)*f,y:(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*f}}
function init(){
scene=new THREE.Scene();scene.background=new THREE.Color('#070311');
camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,300);camera.position.z=52;
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);stage.appendChild(renderer.domElement);
heart=new THREE.Group();scene.add(heart);
const n=3800,pos=new Float32Array(n*3),col=new Float32Array(n*3),pal=['#ff2ea6','#ff66d0','#ffa5ed','#b74dff','#fff0fc','#f92b72'].map(c=>new THREE.Color(c));
for(let i=0;i<n;i++){let p=hp(Math.random()*Math.PI*2,Math.sqrt(Math.random()));pos[3*i]=p.x+(Math.random()-.5)*.6;pos[3*i+1]=p.y+(Math.random()-.5)*.6;pos[3*i+2]=(Math.random()-.5)*8;let c=pal[Math.random()*pal.length|0];col[3*i]=c.r;col[3*i+1]=c.g;col[3*i+2]=c.b}
let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
cloud=new THREE.Points(g,new THREE.PointsMaterial({size:.095,vertexColors:true,transparent:true,opacity:.94,blending:THREE.AdditiveBlending,depthWrite:false}));heart.add(cloud);
let op=[];for(let i=0;i<850;i++){let p=hp(Math.PI*2*i/850);op.push(p.x,p.y,(Math.random()-.5)*.5)}
let og=new THREE.BufferGeometry();og.setAttribute('position',new THREE.Float32BufferAttribute(op,3));outline=new THREE.Points(og,new THREE.PointsMaterial({color:'#ffd7fa',size:.11,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));heart.add(outline);
let starPos=new Float32Array(1800);for(let i=0;i<600;i++){starPos[3*i]=(Math.random()-.5)*52;starPos[3*i+1]=(Math.random()-.5)*42;starPos[3*i+2]=(Math.random()-.5)*26-7}
let sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(starPos,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:'#9f80d5',size:.05,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false})));
let drag=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(drag&&!cameraOn){ty+=(e.clientX-px)*.008;tx+=(e.clientY-py)*.008;px=e.clientX;py=e.clientY}});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>ts=Math.max(.55,Math.min(1.8,ts*(e.deltaY<0?1.08:.92))),{passive:true});
document.getElementById('resetBtn').onclick=()=>{tx=-.12;ty=.18;ts=1};document.getElementById('sizeDown').onclick=()=>ts=Math.max(.55,ts*.88);document.getElementById('sizeUp').onclick=()=>ts=Math.min(1.8,ts*1.12);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6))});
cameraBtn.onclick=toggleCamera;animate()
}
function animate(){requestAnimationFrame(animate);if(!renderer)return;let t=performance.now()*.001;heart.rotation.x+=(tx-heart.rotation.x)*.08;heart.rotation.y+=(ty-heart.rotation.y)*.08;cs+=(ts-cs)*.08;heart.scale.setScalar(cs*(1+.018*Math.sin(t*2.2)));cloud.rotation.z=Math.sin(t*.25)*.03;cloud.material.opacity=.84+.12*(.5+.5*Math.sin(t*2.5));renderer.render(scene,camera)}
function msg(s){status.textContent=s}
async function toggleCamera(){
if(cameraOn){stopCamera();return}
if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){msg('Камера доступна только на HTTPS. Открой сайт через GitHub Pages, а не как локальный файл.');return}
if(typeof Hands==='undefined'||typeof Camera==='undefined'){msg('Не загрузился модуль распознавания руки. Проверь интернет и обнови страницу.');return}
try{msg('Запрашиваем доступ к селфи-камере…');hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});hands.onResults(onHand);
handCamera=new Camera(video,{onFrame:async()=>{if(hands&&video.readyState>=2)await hands.send({image:video})},width:640,height:480});await handCamera.start();cameraOn=true;video.style.display='block';cameraBtn.textContent='Отключить камеру';mode.textContent='HAND TRACKING';msg('Покажи ладонь целиком. Двигай рукой для вращения; меняй расстояние между большим и указательным пальцами для размера.')}
catch(e){stopCamera();msg('Не удалось включить камеру. Разреши её для этого сайта и открой страницу в отдельной вкладке HTTPS. '+(e.name||''))}
}
function onHand(r){let h=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!h){if(Date.now()-lastSeen>1800)msg('Рука не найдена — покажи ладонь целиком в кадре.');return}lastSeen=Date.now();tx=(h[9].y-.5)*1.5;ty=((1-h[9].x)-.5)*2.5;let pinch=Math.hypot(h[4].x-h[8].x,h[4].y-h[8].y);if(lastPinch!==null)ts=Math.max(.55,Math.min(1.8,ts+(pinch-lastPinch)*1.9));lastPinch=pinch;msg('Рука отслеживается ✓ Двигай рукой для вращения, сближай/разводи пальцы для размера.')}
function stopCamera(){cameraOn=false;try{handCamera?.stop()}catch(e){}handCamera=null;try{hands?.close()}catch(e){}hands=null;if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;video.style.display='none';cameraBtn.textContent='♡ Включить камеру';mode.textContent='TOUCH / MOUSE';lastPinch=null}
if(window.THREE){try{init()}catch(e){msg('Ошибка графики: '+e.message)}}else msg('Three.js не загрузился. Проверь интернет и обнови страницу.');
addEventListener('pagehide',stopCamera)
})();
</script></body></html>
